name: Daily Gold ETF Update

on:
  schedule:
    - cron: '30 7 * * *'  # Runs at 1:00 PM IST
    - cron: '30 12 * * *' # Runs at 6:00 PM IST
  workflow_dispatch:      # Allows manual trigger

jobs:
  update-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install -U -r requirements.txt

      - name: Fetch Latest Data (Excel)
        run: python update_daily_tracker.py

      - name: Generate HTML Dashboard
        run: python generate_daily_html_dashboard.py

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add Gold_ETF_Daily_Price_Tracker.xlsx index.html
          git diff --quiet && git diff --staged --quiet || git commit -m "Automated daily market update"
          git push
